# The connection anchor terminates the TCP connections of Actors whose
# ActorTemplate is annotated ate.dev/connection-policy=Preserve, so those
# connections survive Suspend and Resume on any worker. The router sends such
# an Actor's ingress here (port 443) instead of to its worker; the worker's
# ateom tunnels the sandbox's frames here (port 445) and probes readiness
# through here (port 446).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: atenet-anchor
  namespace: ate-system

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: atenet-anchor
  namespace: ate-system
  labels:
    app: atenet-anchor
spec:
  # One replica: every anchored Actor's endpoints live in this pod, and the
  # router and workers reach it by its Service name. Sharding Actors across
  # several anchors is a follow-up.
  replicas: 1
  selector:
    matchLabels:
      app: atenet-anchor
  template:
    metadata:
      labels:
        app: atenet-anchor
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    spec:
      serviceAccountName: atenet-anchor
      containers:
      - name: atenet-anchor
        image: ko://github.com/agent-substrate/substrate/cmd/atenet
        args:
        - anchor
        - --ingress-listen=:443
        - --attach-listen=:445
        - --control-listen=:446
        - --ingress-credential-bundle=/run/podidentity.podcert.ate.dev/credential-bundle.pem
        - --credential-bundle=/run/servicedns.podcert.ate.dev/credential-bundle.pem
        - --trust-bundle=/run/podidentity.podcert.ate.dev/trust-bundle.pem
        - --metrics-listen-addr=:9090
        - --hold-ttl=24h
        - --credential-broker-socket=/var/lib/ateom-gvisor/credential-broker.sock
        - --egress-gateway-trust-bundle=/run/servicedns.podcert.ate.dev/trust-bundle.pem
        - --connect-listen=:444
        - --status-listen=:8080
        # Every attach is checked against the actor's assignment in ateapi.
        - --ateapi-address=api.ate-system.svc:443
        - --ateapi-server-name=api.ate-system.svc
        - --ateapi-ca-file=/run/servicedns.podcert.ate.dev/trust-bundle.pem
        - --ateapi-client-cert=/run/podidentity.podcert.ate.dev/credential-bundle.pem
        # OTLP exporter settings shared by every control plane component.
        envFrom:
        - configMapRef:
            name: ate-otel-config
        ports:
        - name: https
          containerPort: 443
        - name: connect
          containerPort: 444
        - name: attach
          containerPort: 445
        - name: control
          containerPort: 446
        - name: metrics
          containerPort: 9090
        - name: status
          containerPort: 8080
        readinessProbe:
          httpGet:
            path: /readyz
            port: 9090
          periodSeconds: 2
        livenessProbe:
          httpGet:
            path: /healthz
            port: 9090
          initialDelaySeconds: 10
          periodSeconds: 10
        volumeMounts:
        - name: servicedns
          mountPath: /run/servicedns.podcert.ate.dev
          readOnly: true
        - name: podidentity
          mountPath: /run/podidentity.podcert.ate.dev
          readOnly: true
        # The node-local atelet credential broker socket, shared with worker
        # pods the same way, so the anchor can mint actor certificates for
        # egress.
        - name: run-ateom
          mountPath: /var/lib/ateom-gvisor
          mountPropagation: HostToContainer
      volumes:
      - name: run-ateom
        hostPath:
          path: /var/lib/ateom-gvisor
          type: DirectoryOrCreate
      - name: servicedns
        projected:
          sources:
          - podCertificate:
              signerName: servicedns.podcert.ate.dev/identity
              keyType: ECDSAP256
              credentialBundlePath: credential-bundle.pem
          - clusterTrustBundle:
              signerName: servicedns.podcert.ate.dev/identity
              labelSelector:
                matchLabels:
                  podcert.ate.dev/canarying: live
              path: trust-bundle.pem
      - name: podidentity
        projected:
          sources:
          - podCertificate:
              signerName: podidentity.podcert.ate.dev/identity
              keyType: ECDSAP256
              credentialBundlePath: credential-bundle.pem
          - clusterTrustBundle:
              signerName: podidentity.podcert.ate.dev/identity
              labelSelector:
                matchLabels:
                  podcert.ate.dev/canarying: live
              path: trust-bundle.pem

---

apiVersion: v1
kind: Service
metadata:
  name: atenet-anchor
  namespace: ate-system
spec:
  selector:
    app: atenet-anchor
  ports:
  - name: https
    port: 443
    targetPort: https
  - name: connect
    port: 444
    targetPort: connect
  - name: attach
    port: 445
    targetPort: attach
  - name: control
    port: 446
    targetPort: control
